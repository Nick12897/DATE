<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="romanticGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEEDEC" />
      <stop offset="50%" stop-color="#FCD6D4" />
      <stop offset="100%" stop-color="#EE8582" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="100" cy="100" r="96" fill="url(#romanticGradient)" />

  <!-- Inner Soft Circle -->
  <circle cx="100" cy="100" r="82" fill="#FFFDF9" />

  <!-- Big Romantic Heart -->
  <path d="M100 148 C100 148, 52 114, 52 82 C52 62, 68 46, 86 46 C94 46, 98 50, 100 54 C102 50, 106 46, 114 46 C132 46, 148 62, 148 82 C148 114, 100 148, 100 148 Z" 
        fill="#E05A47" 
        filter="url(#softGlow)" />

  <!-- Mini highlight inside heart -->
  <ellipse cx="80" cy="68" rx="8" ry="14" transform="rotate(-30 80 68)" fill="#FFA599" opacity="0.6" />

  <!-- Sparkles -->
  <circle cx="150" cy="50" r="3.5" fill="#EE8582" />
  <circle cx="50" cy="130" r="3" fill="#EE8582" />
  <circle cx="155" cy="120" r="2" fill="#E05A47" />
</svg>
